name: Trusted Governance Verifier

on:
  workflow_run:
    workflows:
      - CI/CD Pipeline
    types:
      - completed

permissions:
  contents: read

jobs:
  trusted_governance_gate:
    name: Emit independent Trusted Governance Gate
    if: ${{ vars.TRUSTED_GOVERNANCE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: trusted-governance-verifier
    permissions:
      contents: read
    steps:
      - name: Checkout current protected main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Create downscoped verifier App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.TRUSTED_GOVERNANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRUSTED_GOVERNANCE_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-administration: read
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read

      - name: Verify live authority and emit App-owned check
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          EXPECTED_APP_ID: ${{ vars.TRUSTED_GOVERNANCE_APP_ID }}
          EXPECTED_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RULESET_ID: ${{ vars.TRUSTED_INTEGRATION_RULESET_ID }}
          RULESET_DIGEST: ${{ vars.TRUSTED_INTEGRATION_RULESET_DIGEST }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: >-
          python3 scripts/ci/trusted_governance_gate.py
          --api-url '${{ github.api_url }}'
          --repository '${{ github.repository }}'
          --repository-root .
          verify-workflow-run
          --run-id "$SOURCE_RUN_ID"
          --run-attempt "$SOURCE_RUN_ATTEMPT"
          --expected-app-slug "$EXPECTED_APP_SLUG"
          --expected-app-id "$EXPECTED_APP_ID"
          --ruleset-id "$RULESET_ID"
          --ruleset-digest "$RULESET_DIGEST"
