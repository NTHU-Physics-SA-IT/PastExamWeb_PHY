name: Validate PR base branch

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  check-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout immutable pull request base
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: trusted-base
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Checkout immutable pull request head
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: proposed-head
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require an approved pull request base
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          TRUSTED_ROOT: trusted-base
          PROPOSED_ROOT: proposed-head
        run: |
          set -euo pipefail

          config="$TRUSTED_ROOT/.github/project-governance.json"
          resolver="$TRUSTED_ROOT/scripts/ci/project_governance.py"

          if [[ "$BASE_BRANCH" == "main" && -f "$config" && -f "$resolver" ]]; then
            python3 "$resolver" \
              --repository-root "$TRUSTED_ROOT" \
              validate-pr-base \
              --base "$BASE_BRANCH"
            python3 "$resolver" \
              --repository-root "$PROPOSED_ROOT" \
              validate-branch-authority \
              --branch "$BASE_BRANCH"
            exit 0
          fi

          if [[ "$BASE_BRANCH" == "main" && ( -e "$config" || -e "$resolver" ) ]]; then
            echo "Trusted project governance is incomplete." >&2
            exit 2
          fi

          if [[ "$BASE_BRANCH" == "main" ]]; then
            echo "Pull request base branch is allowed during governance bootstrap."
            exit 0
          fi

          if [[ "$BASE_BRANCH" != integration/* ]]; then
            echo "Pull request base is not approved: $BASE_BRANCH" >&2
            exit 1
          fi

          python3 "$resolver" \
            --repository-root "$TRUSTED_ROOT" \
            validate-pr-base \
            --base "$BASE_BRANCH"
          python3 "$resolver" \
            --repository-root "$PROPOSED_ROOT" \
            validate-branch-authority \
            --branch "$BASE_BRANCH"
