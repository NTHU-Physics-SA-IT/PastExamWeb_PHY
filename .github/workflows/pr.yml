name: Validate PR base branch

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  check-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout immutable pull request base
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Require an approved pull request base
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          python3 scripts/ci/project_governance.py \
            validate-pr-base \
            --base "$BASE_BRANCH"
