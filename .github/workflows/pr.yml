name: Validate PR base branch

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  check-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout current protected main authority
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: trusted-main
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Checkout immutable pull request base
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          path: trusted-base
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Require an approved pull request base
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRUSTED_ROOT: trusted-base
          TRUSTED_MAIN_ROOT: trusted-main
          TRUSTED_VERIFIER_APP_ID: ${{ vars.TRUSTED_GOVERNANCE_APP_ID || 0 }}
          TRUSTED_RULESET_ID: ${{ vars.TRUSTED_INTEGRATION_RULESET_ID || 0 }}
          TRUSTED_RULESET_DIGEST: ${{ vars.TRUSTED_INTEGRATION_RULESET_DIGEST }}
        run: |
          set -euo pipefail

          config="$TRUSTED_ROOT/.github/project-governance.json"
          resolver="$TRUSTED_ROOT/scripts/ci/project_governance.py"

          if [[ "$BASE_BRANCH" == "main" && -f "$config" && -f "$resolver" ]]; then
            python3 "$resolver" \
              --repository-root "$TRUSTED_ROOT" \
              validate-pr-base \
              --base "$BASE_BRANCH"
            exit 0
          fi

          if [[ "$BASE_BRANCH" == "main" && ( -e "$config" || -e "$resolver" ) ]]; then
            echo "Trusted project governance is incomplete." >&2
            exit 2
          fi

          if [[ "$BASE_BRANCH" == "main" ]]; then
            echo "Pull request base branch is allowed during governance bootstrap."
            exit 0
          fi

          if [[ "$BASE_BRANCH" != integration/* ]]; then
            echo "Pull request base is not approved: $BASE_BRANCH" >&2
            exit 1
          fi

          trusted_validator="$TRUSTED_MAIN_ROOT/scripts/ci/trusted_governance_gate.py"
          if [[ ! -f "$trusted_validator" || \
                "$TRUSTED_VERIFIER_APP_ID" == "0" || \
                "$TRUSTED_RULESET_ID" == "0" || \
                -z "$TRUSTED_RULESET_DIGEST" ]]; then
            echo "Trusted Activation authority is unavailable." >&2
            exit 2
          fi

          GITHUB_TOKEN="$GH_TOKEN" python3 "$trusted_validator" \
            --api-url '${{ github.api_url }}' \
            --repository "$REPOSITORY" \
            --repository-root "$TRUSTED_MAIN_ROOT" \
            validate-pr-base \
            --base "$BASE_BRANCH" \
            --expected-app-id "$TRUSTED_VERIFIER_APP_ID" \
            --ruleset-id "$TRUSTED_RULESET_ID" \
            --ruleset-digest "$TRUSTED_RULESET_DIGEST"
