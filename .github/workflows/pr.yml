name: Validate PR base branch

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

jobs:
  check-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require an approved pull request base
        shell: bash
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          case "$BASE_BRANCH" in
            main|integration/stage-5bd)
              ;;
            *)
              echo \
                "Pull requests must target an approved base; received: $BASE_BRANCH" \
                >&2
              exit 1
              ;;
          esac

          echo "Pull request base branch is allowed."
