name: Roll back reviewed production release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact retained previous production SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-activation
  cancel-in-progress: false

jobs:
  authority:
    runs-on: ubuntu-latest
    outputs:
      source_ci_run_id: ${{ steps.full.outputs.source_ci_run_id }}
      source_ci_run_attempt: ${{ steps.full.outputs.source_ci_run_attempt }}
      manifest_sha256: ${{ steps.artifacts.outputs.release_manifest_sha256 }}
      receipt_sha256: ${{ steps.artifacts.outputs.candidate_receipt_sha256 }}
    steps:
      - name: Checkout current protected workflow source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require current main workflow authority
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Resolve target's authoritative Main Full
        id: full
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/validate_candidate_source_run.py \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha '${{ inputs.target_sha }}' \
            --output "$GITHUB_OUTPUT"

      - name: Download target image authority
        uses: actions/download-artifact@v7
        with:
          name: production-image-authority-${{ inputs.target_sha }}
          path: ${{ runner.temp }}/image-authority
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.full.outputs.source_ci_run_id }}

      - name: Download target candidate receipt
        uses: actions/download-artifact@v7
        with:
          name: production-candidate-receipt-${{ inputs.target_sha }}
          path: ${{ runner.temp }}/candidate-receipt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.full.outputs.source_ci_run_id }}

      - name: Bind rollback target artifacts
        id: artifacts
        run: |
          git show '${{ inputs.target_sha }}:docker/docker-compose.prod.yml' \
            >"$RUNNER_TEMP/rollback-target-compose.yml"
          python3 scripts/ci/validate_activation_authority.py \
            --receipt "$RUNNER_TEMP/candidate-receipt/candidate-receipt.json" \
            --image-authority "$RUNNER_TEMP/image-authority/production-image-authority.env" \
            --release-sha '${{ inputs.target_sha }}' \
            --source-ci-run-id '${{ steps.full.outputs.source_ci_run_id }}' \
            --source-ci-run-attempt '${{ steps.full.outputs.source_ci_run_attempt }}' \
            --legacy-nginx-compose "$RUNNER_TEMP/rollback-target-compose.yml" \
            --output "$GITHUB_OUTPUT"

  rollback:
    needs: authority
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Checkout current protected workflow source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Re-lock current main after approval
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"

      - name: Configure restricted production SSH identity
        env:
          ACTIVATION_HOST: ${{ secrets.PRODUCTION_ACTIVATION_HOST }}
          ACTIVATION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_ACTIVATION_KNOWN_HOSTS }}
          ACTIVATION_PRIVATE_KEY: ${{ secrets.PRODUCTION_ACTIVATION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ACTIVATION_PRIVATE_KEY" >~/.ssh/pastexam-activate
          chmod 600 ~/.ssh/pastexam-activate
          printf '%s\n' "$ACTIVATION_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$ACTIVATION_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Execute one explicit DB-safe rollback request
        env:
          ACTIVATION_HOST: ${{ secrets.PRODUCTION_ACTIVATION_HOST }}
          ACTIVATION_USER: ${{ secrets.PRODUCTION_ACTIVATION_USER }}
          TARGET_SHA: ${{ inputs.target_sha }}
          SOURCE_RUN: ${{ needs.authority.outputs.source_ci_run_id }}
          SOURCE_ATTEMPT: ${{ needs.authority.outputs.source_ci_run_attempt }}
          EXPECTED_MANIFEST: ${{ needs.authority.outputs.manifest_sha256 }}
          EXPECTED_RECEIPT: ${{ needs.authority.outputs.receipt_sha256 }}
          CURRENT_MAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh_command=(ssh -i ~/.ssh/pastexam-activate -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ACTIVATION_USER@$ACTIVATION_HOST")
          "${ssh_command[@]}" status >"$RUNNER_TEMP/production-status.json"
          "${ssh_command[@]}" \
            "rollback-preflight $TARGET_SHA $SOURCE_RUN $SOURCE_ATTEMPT" \
            >"$RUNNER_TEMP/rollback-preflight.json"
          python3 - "$RUNNER_TEMP/rollback-preflight.json" \
            "$TARGET_SHA" "$EXPECTED_MANIFEST" "$EXPECTED_RECEIPT" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          expected = {
              "target_sha": sys.argv[2],
              "manifest_sha256": sys.argv[3],
              "candidate_receipt_sha256": sys.argv[4],
              "outcome": "rollback-eligible",
          }
          if any(data.get(key) != value for key, value in expected.items()):
              raise SystemExit("Host rollback authority disagrees.")
          PY
          request_id="rollback-$GITHUB_RUN_ID"
          state="$RUNNER_TEMP/rollback-state.json"
          if ! "${ssh_command[@]}" "request-status $request_id" >"$state" 2>/dev/null; then
            git fetch --no-tags origin main
            test "$(git rev-parse origin/main)" = "$CURRENT_MAIN_SHA"
            "${ssh_command[@]}" \
              "rollback-start $TARGET_SHA $request_id $SOURCE_RUN $SOURCE_ATTEMPT $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT" \
              >"$state"
          fi
          resumed=false
          for _ in $(seq 1 120); do
            "${ssh_command[@]}" "request-status $request_id" >"$state"
            read -r status phase < <(python3 - "$state" <<'PY'
          import json, pathlib, sys
          data = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(data["state"], data["phase"])
          PY
          )
            case "$status" in
              ROLLED_BACK) break ;;
              ACTIVE|FAILED)
                echo "Production rollback reached terminal state $status." >&2
                exit 2
                ;;
            esac
            if [ "$phase" = finalization-retry-required ] && [ "$resumed" = false ]; then
              "${ssh_command[@]}" "resume $request_id" >/dev/null
              resumed=true
            fi
            sleep 10
          done
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["state"])' "$state")" = ROLLED_BACK
          "${ssh_command[@]}" "receipt $request_id" >"$RUNNER_TEMP/production-rollback-receipt.json"

      - name: Upload durable production rollback receipt
        uses: actions/upload-artifact@v6
        with:
          name: production-rollback-receipt-${{ inputs.target_sha }}
          path: ${{ runner.temp }}/production-rollback-receipt.json
          if-no-files-found: error
          retention-days: 365

      - name: Remove ephemeral activation key
        if: always()
        run: rm -f -- ~/.ssh/pastexam-activate
