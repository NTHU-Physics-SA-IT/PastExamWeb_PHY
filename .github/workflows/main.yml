name: CI/CD Pipeline

on:
  push:
    branches-ignore:
      - "analytics-assets"
  pull_request:
    branches:
      - "main"
      - "integration/**"
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read
  actions: read
  packages: write

jobs:
  ci_mode:
    name: Detect CI mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      ci_mode: ${{ steps.classify.outputs.ci_mode }}
      reason: ${{ steps.classify.outputs.reason }}
      comparison_base: ${{ steps.classify.outputs.comparison_base }}
      source_sha: ${{ steps.classify.outputs.source_sha }}
      source_run_id: ${{ steps.classify.outputs.source_run_id }}
      source_tree: ${{ steps.classify.outputs.source_tree }}
      workflow_revision: ${{ steps.classify.outputs.workflow_revision }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main comparison ref
        id: fetch_main
        if: >-
          ${{ github.event_name == 'push' &&
              github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          if git fetch \
            --no-tags \
            origin \
            main:refs/remotes/origin/main; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "origin/main unavailable; classifier will fail closed to full CI."
          fi

      - name: Classify CI mode
        id: classify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          EVENT_CURRENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_FORCED: ${{ github.event.forced || false }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          EVENT_PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPOSITORY: >-
            ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_REPOSITORY_ID: >-
            ${{ github.event.pull_request.head.repo.id || 0 }}
          COMPARISON_REF_READY: ${{ steps.fetch_main.outputs.ready }}
          API_URL: ${{ github.api_url }}
        run: |
          python3 scripts/ci/classify_ci_mode.py \
            --event-name "$EVENT_NAME" \
            --action "$EVENT_ACTION" \
            --before-sha "$EVENT_BEFORE_SHA" \
            --current-sha "$EVENT_CURRENT_SHA" \
            --ref "$EVENT_REF" \
            --forced "$EVENT_FORCED" \
            --repository "$EVENT_REPOSITORY" \
            --repository-id "$EVENT_REPOSITORY_ID" \
            --pr-number "$EVENT_PR_NUMBER" \
            --draft "$EVENT_PR_DRAFT" \
            --base-ref "$EVENT_BASE_REF" \
            --base-sha "$EVENT_BASE_SHA" \
            --head-ref "$EVENT_HEAD_REF" \
            --head-sha "$EVENT_HEAD_SHA" \
            --head-repository "$EVENT_HEAD_REPOSITORY" \
            --head-repository-id "$EVENT_HEAD_REPOSITORY_ID" \
            --comparison-ref-ready "$COMPARISON_REF_READY" \
            --api-url "$API_URL" \
            --github-output "$GITHUB_OUTPUT"

  lint:
    needs: ci_mode
    if: ${{ always() && needs.ci_mode.result == 'success' }}
    uses: ./.github/workflows/lint.yml
    with:
      run_checks: ${{ needs.ci_mode.outputs.ci_mode == 'full' }}

  test:
    needs: [ci_mode, lint]
    if: ${{ always() && needs.ci_mode.result == 'success' }}
    uses: ./.github/workflows/test.yml
    with:
      run_checks: >-
        ${{ needs.ci_mode.outputs.ci_mode == 'full' &&
            needs.lint.result == 'success' }}

  build:
    needs: [ci_mode, lint, test]
    if: ${{ always() && needs.ci_mode.result == 'success' }}
    uses: ./.github/workflows/build.yml
    with:
      run_checks: >-
        ${{ needs.ci_mode.outputs.ci_mode == 'full' &&
            needs.lint.result == 'success' &&
            needs.test.result == 'success' }}
      push_images: >-
        ${{ needs.ci_mode.outputs.ci_mode == 'full' &&
            github.event_name == 'push' &&
            github.ref == 'refs/heads/main' }}
    secrets: inherit

  equivalent_provenance:
    name: Equivalent merge provenance
    needs: ci_mode
    if: >-
      ${{ always() &&
          needs.ci_mode.result == 'success' &&
          needs.ci_mode.outputs.ci_mode == 'equivalent-merge' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout repository with complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Revalidate equivalent merge evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_BEFORE_SHA: ${{ github.event.before }}
          EVENT_CURRENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
          EVENT_FORCED: ${{ github.event.forced || false }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.repository_id }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          EVENT_PR_DRAFT: ${{ github.event.pull_request.draft || false }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPOSITORY: >-
            ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_HEAD_REPOSITORY_ID: >-
            ${{ github.event.pull_request.head.repo.id || 0 }}
          API_URL: ${{ github.api_url }}
        run: |
          python3 scripts/ci/classify_ci_mode.py \
            --event-name "$EVENT_NAME" \
            --action "$EVENT_ACTION" \
            --before-sha "$EVENT_BEFORE_SHA" \
            --current-sha "$EVENT_CURRENT_SHA" \
            --ref "$EVENT_REF" \
            --forced "$EVENT_FORCED" \
            --repository "$EVENT_REPOSITORY" \
            --repository-id "$EVENT_REPOSITORY_ID" \
            --pr-number "$EVENT_PR_NUMBER" \
            --draft "$EVENT_PR_DRAFT" \
            --base-ref "$EVENT_BASE_REF" \
            --base-sha "$EVENT_BASE_SHA" \
            --head-ref "$EVENT_HEAD_REF" \
            --head-sha "$EVENT_HEAD_SHA" \
            --head-repository "$EVENT_HEAD_REPOSITORY" \
            --head-repository-id "$EVENT_HEAD_REPOSITORY_ID" \
            --api-url "$API_URL" \
            --expect-mode equivalent-merge

  docs_gate:
    name: Docs-only gate
    needs: ci_mode
    if: >-
      ${{ always() &&
          needs.ci_mode.result == 'success' &&
          needs.ci_mode.outputs.ci_mode == 'docs-only' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository with complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch main comparison ref
        shell: bash
        run: |
          if ! git fetch \
            --no-tags \
            origin \
            main:refs/remotes/origin/main; then
            echo "Unable to fetch origin/main for docs-only revalidation." >&2
            exit 1
          fi

      - name: Revalidate documentation-only scope
        run: >-
          python3 scripts/ci/classify_ci_mode.py
          --event-name '${{ github.event_name }}'
          --before-sha '${{ github.event.before }}'
          --current-sha '${{ github.sha }}'
          --ref '${{ github.ref }}'
          --forced '${{ github.event.forced }}'
          --repository '${{ github.repository }}'
          --repository-id '${{ github.repository_id }}'
          --api-url '${{ github.api_url }}'
          --expect-mode docs-only

  full_attestation:
    name: Full CI Attestation
    needs: [ci_mode, lint, test, build]
    if: >-
      ${{ always() &&
          needs.ci_mode.result == 'success' &&
          needs.ci_mode.outputs.ci_mode == 'full' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      mode: ${{ steps.attest.outputs.mode }}
      sha: ${{ steps.attest.outputs.sha }}
      tree_sha: ${{ steps.attest.outputs.tree_sha }}
      workflow_revision: ${{ steps.attest.outputs.workflow_revision }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate complete full-CI evidence
        id: attest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ATTESTED_SHA: ${{ github.sha }}
          EXECUTION_HEAD_SHA: >-
            ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 scripts/ci/validate_ci_gate.py full-attestation
          --mode '${{ needs.ci_mode.outputs.ci_mode }}'
          --classifier-result '${{ needs.ci_mode.result }}'
          --lint-result '${{ needs.lint.result }}'
          --test-result '${{ needs.test.result }}'
          --build-result '${{ needs.build.result }}'
          --api-url '${{ github.api_url }}'
          --repository '${{ github.repository }}'
          --run-id '${{ github.run_id }}'
          --run-attempt '${{ github.run_attempt }}'
          --event-name "$EVENT_NAME"
          --attested-sha "$ATTESTED_SHA"
          --execution-head-sha "$EXECUTION_HEAD_SHA"
          --pr-number "$EVENT_PR_NUMBER"
          --base-sha "$EVENT_BASE_SHA"
          --github-output "$GITHUB_OUTPUT"

  ci_gate:
    name: CI Gate
    needs:
      - ci_mode
      - lint
      - test
      - build
      - equivalent_provenance
      - docs_gate
      - full_attestation
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate aggregate CI result
        run: >-
          python3 scripts/ci/validate_ci_gate.py ci-gate
          --mode '${{ needs.ci_mode.outputs.ci_mode }}'
          --classifier-result '${{ needs.ci_mode.result }}'
          --lint-result '${{ needs.lint.result }}'
          --test-result '${{ needs.test.result }}'
          --build-result '${{ needs.build.result }}'
          --equivalent-result '${{ needs.equivalent_provenance.result }}'
          --docs-result '${{ needs.docs_gate.result }}'
          --full-attestation-result '${{ needs.full_attestation.result }}'

  release:
    needs: [ci_mode, lint, test, build, ci_gate]
    if: >-
      always() &&
      needs.ci_mode.outputs.ci_mode == 'full' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      needs.ci_gate.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/release.yml
    with:
      release_sha: ${{ github.sha }}
    secrets: inherit

  deploy:
    needs: [ci_mode, lint, test, build, ci_gate]
    if: >-
      always() &&
      needs.ci_mode.outputs.ci_mode == 'full' &&
      needs.lint.result == 'success' &&
      needs.test.result == 'success' &&
      needs.build.result == 'success' &&
      needs.ci_gate.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      release_sha: ${{ github.sha }}
      frontend_image_digest: ${{ needs.build.outputs.frontend_digest }}
      backend_image_digest: ${{ needs.build.outputs.backend_digest }}
    secrets: inherit
