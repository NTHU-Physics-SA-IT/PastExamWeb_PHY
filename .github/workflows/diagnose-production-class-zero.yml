name: Diagnose production Class-0 gate

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current main SHA to diagnose
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: production-activation
  cancel-in-progress: false

jobs:
  authority:
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.full.outputs.release_sha }}
      source_ci_run_id: ${{ steps.full.outputs.source_ci_run_id }}
      source_ci_run_attempt: ${{ steps.full.outputs.source_ci_run_attempt }}
    steps:
      - name: Checkout the exact requested main authority
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_sha }}

      - name: Require workflow source and target to be exact current main
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SHA" = "$TARGET_SHA"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"

      - name: Require production deploy authority
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHORITY_SHA: ${{ inputs.target_sha }}
          ORIGINAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          python3 scripts/ci/validate_production_deploy_authority.py \
            --repository "$GITHUB_REPOSITORY" \
            --authority-sha "$AUTHORITY_SHA" \
            --base-branch main \
            --actor "$ORIGINAL_ACTOR" \
            --triggering-actor "$TRIGGERING_ACTOR" \
            --authority-file .github/production-deploy-authority.json

      - name: Resolve authoritative exact-SHA Main Full
        id: full
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/ci/validate_candidate_source_run.py \
            --repository "$GITHUB_REPOSITORY" \
            --release-sha '${{ inputs.target_sha }}' \
            --output "$GITHUB_OUTPUT"

  diagnose:
    needs: authority
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout approved exact source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.authority.outputs.release_sha }}

      - name: Re-lock current main and Main Full after approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ needs.authority.outputs.release_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$TARGET_SHA"
          authority="$RUNNER_TEMP/fresh-main-full.env"
          python3 scripts/ci/validate_candidate_source_run.py \
            --repository "$GITHUB_REPOSITORY" --release-sha "$TARGET_SHA" \
            --output "$authority"
          test '${{ needs.authority.outputs.source_ci_run_id }}' = \
            "$(sed -n 's/^source_ci_run_id=//p' "$authority")"
          test '${{ needs.authority.outputs.source_ci_run_attempt }}' = \
            "$(sed -n 's/^source_ci_run_attempt=//p' "$authority")"

      - name: Revalidate production deploy authority after approval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHORITY_SHA: ${{ needs.authority.outputs.release_sha }}
          ORIGINAL_ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          python3 scripts/ci/validate_production_deploy_authority.py \
            --repository "$GITHUB_REPOSITORY" \
            --authority-sha "$AUTHORITY_SHA" \
            --base-branch main \
            --actor "$ORIGINAL_ACTOR" \
            --triggering-actor "$TRIGGERING_ACTOR" \
            --authority-file .github/production-deploy-authority.json

      - name: Configure restricted production SSH identity
        env:
          ACTIVATION_HOST: ${{ secrets.PRODUCTION_ACTIVATION_HOST }}
          ACTIVATION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_ACTIVATION_KNOWN_HOSTS }}
          ACTIVATION_PRIVATE_KEY: ${{ secrets.PRODUCTION_ACTIVATION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ACTIVATION_PRIVATE_KEY" >~/.ssh/pastexam-activate
          chmod 600 ~/.ssh/pastexam-activate
          printf '%s\n' "$ACTIVATION_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -F "$ACTIVATION_HOST" -f ~/.ssh/known_hosts >/dev/null

      - name: Run fixed production Class-0 diagnostic
        env:
          ACTIVATION_HOST: ${{ secrets.PRODUCTION_ACTIVATION_HOST }}
          ACTIVATION_USER: ${{ secrets.PRODUCTION_ACTIVATION_USER }}
          TARGET_SHA: ${{ needs.authority.outputs.release_sha }}
          SOURCE_RUN: ${{ needs.authority.outputs.source_ci_run_id }}
          SOURCE_ATTEMPT: ${{ needs.authority.outputs.source_ci_run_attempt }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/pastexam-activate -o IdentitiesOnly=yes \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$ACTIVATION_USER@$ACTIVATION_HOST" \
            "diagnose-class-zero $TARGET_SHA $SOURCE_RUN $SOURCE_ATTEMPT" \
            >"$RUNNER_TEMP/production-class-zero-diagnostic.unvalidated.json"
          python3 scripts/production-activation-contract.py \
            validate-class-zero-diagnostic \
            --input "$RUNNER_TEMP/production-class-zero-diagnostic.unvalidated.json" \
            --output "$RUNNER_TEMP/production-class-zero-diagnostic.json"
          rm -f -- "$RUNNER_TEMP/production-class-zero-diagnostic.unvalidated.json"

      - name: Upload sanitized Class-0 diagnostic evidence
        uses: actions/upload-artifact@v7
        with:
          name: production-class-zero-diagnostic-${{ needs.authority.outputs.release_sha }}
          path: ${{ runner.temp }}/production-class-zero-diagnostic.json
          if-no-files-found: error
          retention-days: 365

      - name: Remove ephemeral activation key
        if: always()
        run: rm -f -- ~/.ssh/pastexam-activate
