name: Start or Close Coordination

run-name: ${{ inputs.operation }} coordination ${{ inputs.name }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Human coordination intent
        required: true
        type: choice
        options:
          - start
          - close
      name:
        description: Human name such as stage-5e
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  coordination_lifecycle:
    name: Apply protected coordination intent
    if: ${{ vars.TRUSTED_GOVERNANCE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: trusted-coordination-issuance
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout current protected main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Create Contents-only lifecycle App token
        id: ref-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.TRUSTED_GOVERNANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRUSTED_GOVERNANCE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Create isolated ruleset-auditor App token
        id: ruleset-auditor-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.TRUSTED_GOVERNANCE_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRUSTED_GOVERNANCE_APP_PRIVATE_KEY }}
          permission-administration: write

      - name: Resolve authority and apply intent
        env:
          GITHUB_TOKEN: ${{ steps.ref-token.outputs.token }}
          GITHUB_ACTIONS_READ_TOKEN: ${{ github.token }}
          GITHUB_RULESET_AUDITOR_TOKEN: ${{ steps.ruleset-auditor-token.outputs.token }}
          EXPECTED_APP_ID: ${{ vars.TRUSTED_GOVERNANCE_APP_ID }}
          RULESET_ID: ${{ vars.TRUSTED_INTEGRATION_RULESET_ID }}
          OPERATION: ${{ inputs.operation }}
          COORDINATION_NAME: ${{ inputs.name }}
        run: >-
          python3 scripts/ci/coordination.py
          --api-url '${{ github.api_url }}'
          --repository '${{ github.repository }}'
          --expected-app-id "$EXPECTED_APP_ID"
          --ruleset-id "$RULESET_ID"
          "$OPERATION"
          "$COORDINATION_NAME"
