name: Test

on:
  workflow_call:
    inputs:
      run_checks:
        description: Run the expensive CI jobs
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  migration-safety:
    if: ${{ inputs.run_checks }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.14-alpine3.22
        env:
          POSTGRES_USER: migration_test
          POSTGRES_PASSWORD: migration_test_password
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U migration_test -d migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: migration_test
      DB_PASSWORD: migration_test_password
      DB_NAME: migration_test
      TEST_DB_USER: pastexam_test_migration_guard
      TEST_DB_PASSWORD: migration-test-isolated-password
      TEST_DATABASE_NAME: pastexam_test_migration_guard
      SECRET_KEY: migration-test-secret
      FRONTEND_URL: http://localhost
      MINIO_ENDPOINT: localhost:9000
      MINIO_ROOT_USER: test
      MINIO_ROOT_PASSWORD: test-password
      MINIO_BUCKET_NAME: test
      EXTERNAL_ENDPOINT: http://localhost:9000
      REDIS_URL: redis://localhost:6379/0
      DEFAULT_ADMIN_NAME: admin
      DEFAULT_ADMIN_PASSWORD: test-password
      DEFAULT_ADMIN_EMAIL: admin@example.invalid
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Create isolated pytest database
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import os

          import psycopg2

          connection = psycopg2.connect(
              host=os.environ["DB_HOST"],
              port=os.environ["DB_PORT"],
              user=os.environ["DB_USER"],
              password=os.environ["DB_PASSWORD"],
              dbname=os.environ["DB_NAME"],
          )
          connection.autocommit = True
          try:
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      CREATE ROLE pastexam_test_migration_guard
                      LOGIN PASSWORD 'migration-test-isolated-password'
                      NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION
                      """
                  )
                  cursor.execute(
                      """
                      CREATE DATABASE pastexam_test_migration_guard
                      OWNER pastexam_test_migration_guard
                      """
                  )
          finally:
              connection.close()
          PY

      - name: Run isolated migration safety scenarios
        working-directory: backend
        run: |
          export TEST_DATABASE_URL="postgresql+asyncpg://${TEST_DB_USER}:${TEST_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${TEST_DATABASE_NAME}"
          export PASTEXAM_TEST_DATABASE_ISOLATED=true
          export TEST_DATABASE_ALLOWED_HOSTS="127.0.0.1,localhost,db"
          export PASTEXAM_AUDIT_TEST_CONTAINER="${{ job.services.postgres.id }}"
          uv run python -m pytest -q \
            tests/integration/test_migration_safety.py \
            tests/unit/test_audit_policy.py \
            tests/unit/test_read_only_audit.py \
            tests/integration/test_read_only_audit_integration.py
          uv run python audit.py run \
            --audit archive-submission-self-delete-eligibility \
            --mode isolated-test \
            --repository-revision "${GITHUB_SHA}" \
            --output json
          uv run python -m pytest -q \
            ../scripts/tests/test_dev_compose_schema_controls.py \
            ../scripts/tests/test_nginx_oauth_access_logging.py \
            ../scripts/tests/test_postgres_test_bootstrap_contract.py \
            ../scripts/tests/test_production_activation_contract.py \
            ../scripts/tests/test_release_workflow_contract.py \
            --confcutdir=../scripts/tests

      - name: Validate Compose safety contract
        run: ./scripts/validate-compose-safety.sh

  backend:
    name: backend-shard-${{ matrix.shard }}
    if: ${{ inputs.run_checks }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [a, b]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate backend shard manifest
        run: python3 scripts/ci/backend_test_shards.py validate

      - name: Prepare backend env
        run: |
          cp backend/.env.example backend/.env
          cat <<'EOF' >> backend/.env
          # CI-only isolated test credentials. Never use these values for deployment.
          SECRET_KEY=ci-only-secret-key-not-for-production-use
          OAUTH_CLIENT_ID=ci-test-client
          OAUTH_CLIENT_SECRET=ci-test-secret
          EOF

      - name: Prepare frontend env
        run: cp frontend/.env.example frontend/.env

      - name: Prepare docker env
        run: cp docker/.env.example docker/.env

      - name: Start core services
        run: |
          docker compose \
            --env-file docker/.env \
            -f docker/docker-compose.dev.yml \
            up -d --wait --wait-timeout 60 \
            db redis minio

      - name: Verify isolated test database
        run: |
          set -euo pipefail

          docker compose \
            --env-file docker/.env \
            -f docker/docker-compose.dev.yml \
            exec -T db \
            sh -eu -s \
            < scripts/ci/verify-isolated-test-database.sh

      - name: Show database diagnostics
        if: failure()
        run: |
          docker compose \
            --env-file docker/.env \
            -f docker/docker-compose.dev.yml \
            ps
          docker compose \
            --env-file docker/.env \
            -f docker/docker-compose.dev.yml \
            logs db

      - name: Run migrations
        run: |
          docker compose \
            --env-file docker/.env \
            -f docker/docker-compose.dev.yml \
            run --rm \
            -e DB_NAME=pastexam_test_local \
            -e DB_USER=pastexam_test_local \
            -e DB_PASSWORD=local-test-only \
            backend uv run python migrate.py upgrade

      - name: Seed database
        run: |
          docker compose \
            --env-file docker/.env \
            -f docker/docker-compose.dev.yml \
            run --rm \
            -e DB_NAME=pastexam_test_local \
            -e DB_USER=pastexam_test_local \
            -e DB_PASSWORD=local-test-only \
            -e ALLOW_DATABASE_BOOTSTRAP=true \
            backend uv run python app/scripts/seed_db.py \
              --confirm-database-name pastexam_test_local

      - name: Run backend shard with coverage
        env:
          BACKEND_TEST_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail

          mapfile -t test_paths < <(
            python3 scripts/ci/backend_test_shards.py \
              paths \
              --shard "$BACKEND_TEST_SHARD"
          )
          if [[ "${#test_paths[@]}" -eq 0 ]]; then
            echo "Backend test shard resolved to no files." >&2
            exit 1
          fi
          printf 'Backend shard %s selected files:\n' "$BACKEND_TEST_SHARD"
          printf '  %s\n' "${test_paths[@]}"

          docker compose \
            --env-file docker/.env \
            -f docker/docker-compose.dev.yml \
            run --rm \
            -e TEST_DATABASE_URL=postgresql+asyncpg://pastexam_test_local:local-test-only@db:5432/pastexam_test_local \
            -e PASTEXAM_TEST_DATABASE_ISOLATED=true \
            -e COVERAGE_FILE="/app/.coverage.${BACKEND_TEST_SHARD}" \
            backend \
            uv run pytest \
              --cov=app \
              --cov-config=.coveragerc \
              --cov-report= \
              "${test_paths[@]}"

      - name: Upload raw backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-raw-${{ matrix.shard }}
          path: backend/.coverage.${{ matrix.shard }}
          if-no-files-found: error
          include-hidden-files: true

      - name: Tear down
        if: always()
        run: >-
          docker compose
          --env-file docker/.env
          -f docker/docker-compose.dev.yml
          down --volumes --remove-orphans

  backend-coverage:
    name: backend-coverage
    if: ${{ inputs.run_checks }}
    needs: [backend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install backend coverage tooling
        working-directory: backend
        run: uv sync --locked --only-group dev --no-install-project

      - name: Download shard A coverage
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage-raw-a
          path: backend/coverage-raw/a

      - name: Download shard B coverage
        uses: actions/download-artifact@v8
        with:
          name: backend-coverage-raw-b
          path: backend/coverage-raw/b

      - name: Combine backend coverage
        working-directory: backend
        run: |
          set -euo pipefail

          test -f coverage-raw/a/.coverage.a
          test -f coverage-raw/b/.coverage.b
          uv run --no-sync coverage combine coverage-raw/a coverage-raw/b
          uv run --no-sync coverage report --show-missing
          uv run --no-sync coverage html

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/htmlcov
          if-no-files-found: error

  frontend-unit:
    if: ${{ inputs.run_checks }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests with coverage
        working-directory: ./frontend
        run: pnpm test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-unit-coverage
          path: frontend/coverage
          if-no-files-found: warn

  frontend-e2e-family:
    name: frontend-e2e-${{ matrix.family }}
    if: ${{ inputs.run_checks }}
    runs-on: ubuntu-latest
    needs: [backend, frontend-unit]
    strategy:
      fail-fast: false
      matrix:
        family: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright Docker image
        id: playwright-image
        working-directory: ./frontend
        shell: bash
        run: |
          set -euo pipefail

          version="$(
            node -p \
              "require('./node_modules/@playwright/test/package.json').version"
          )"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Playwright version: $version" >&2
            exit 1
          fi

          image="mcr.microsoft.com/playwright:v${version}-noble"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Using Playwright image: $image"

      - name: Pull Playwright image
        env:
          PLAYWRIGHT_IMAGE: ${{ steps.playwright-image.outputs.image }}
        run: |
          set -euo pipefail
          docker pull "$PLAYWRIGHT_IMAGE"

      - name: Prepare backend env
        run: |
          cp backend/.env.example backend/.env
          cat <<'EOF' >> backend/.env
          # CI-only isolated test credentials. Never use these values for deployment.
          SECRET_KEY=ci-only-secret-key-not-for-production-use
          OAUTH_CLIENT_ID=ci-test-client
          OAUTH_CLIENT_SECRET=ci-test-secret
          EOF

      - name: Prepare frontend env
        run: |
          cp frontend/.env.example frontend/.env
          sed -i \
            "s#^VITE_API_BASE_URL=.*#VITE_API_BASE_URL=http://nginx:8080/api#" \
            frontend/.env
          echo "__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=nginx" >> frontend/.env

      - name: Prepare docker env
        run: |
          cp docker/.env.example docker/.env
          sed -i \
            "s/^POSTGRES_DB=.*/POSTGRES_DB=archive_db_dev_e2e/" \
            docker/.env

      - name: Start application stack
        run: >-
          docker compose
          --env-file docker/.env
          -f docker/docker-compose.dev.yml
          up -d

      - name: Bootstrap isolated E2E database
        run: >-
          docker compose
          --env-file docker/.env
          -f docker/docker-compose.dev.yml
          --profile bootstrap
          run --rm bootstrap

      - name: Proxy Vite HMR through nginx
        shell: bash
        run: |
          set -euo pipefail

          hmr_config="$RUNNER_TEMP/playwright-hmr.conf"
          printf '%s\n' \
            'events {}' \
            'http {' \
            '  server {' \
            '    listen 24678;' \
            '    location / {' \
            '      proxy_pass http://frontend:24678;' \
            '      proxy_http_version 1.1;' \
            '      proxy_set_header Host $host;' \
            '      proxy_set_header Upgrade $http_upgrade;' \
            '      proxy_set_header Connection "upgrade";' \
            '    }' \
            '  }' \
            '}' > "$hmr_config"

          docker cp \
            "$hmr_config" \
            pastexam-dev-nginx:/tmp/playwright-hmr.conf
          docker exec \
            pastexam-dev-nginx \
            nginx \
            -c /tmp/playwright-hmr.conf \
            -g "pid /tmp/playwright-hmr.pid;"

      - name: Wait for API readiness
        run: |
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8080/api/statistics > /dev/null &&
              curl -fsS http://127.0.0.1:8080/ > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "API did not become ready in time" >&2
          docker compose \
            --env-file docker/.env \
            -f docker/docker-compose.dev.yml \
            logs backend
          docker compose \
            --env-file docker/.env \
            -f docker/docker-compose.dev.yml \
            logs nginx
          exit 1

      - name: Settle Archive Vite dependencies
        env:
          E2E_FAMILY: ${{ matrix.family }}
          PLAYWRIGHT_IMAGE: ${{ steps.playwright-image.outputs.image }}
        run: |
          set -euo pipefail

          docker network inspect pastexam-dev-network >/dev/null

          docker run \
            --rm \
            --init \
            --ipc=host \
            --user "$(id -u):$(id -g)" \
            --network pastexam-dev-network \
            -e HOME=/tmp/playwright-home \
            -e E2E_FAMILY \
            -e PLAYWRIGHT_BASE_URL=http://nginx:8080 \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/frontend \
            "$PLAYWRIGHT_IMAGE" \
            bash -lc '
              mkdir -p "$HOME"
              node scripts/settle-vite-route.mjs
            '

      - name: List selected frontend E2E cases
        working-directory: ./frontend
        env:
          CI: true
          E2E_FAMILY: ${{ matrix.family }}
          PLAYWRIGHT_START_SERVER: false
          PLAYWRIGHT_ADMIN_USERNAME: admin
          PLAYWRIGHT_ADMIN_PASSWORD: local-admin-only
        run: >-
          ./node_modules/.bin/playwright test
          --list
          --reporter=list
          --project="$E2E_FAMILY"
          --project="${E2E_FAMILY}-admin"

      - name: Run frontend E2E tests
        env:
          E2E_FAMILY: ${{ matrix.family }}
          PLAYWRIGHT_IMAGE: ${{ steps.playwright-image.outputs.image }}
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/report-${{ matrix.family }}.zip
          PLAYWRIGHT_ADMIN_USERNAME: admin
          PLAYWRIGHT_ADMIN_PASSWORD: local-admin-only
        run: |
          set -euo pipefail

          docker network inspect pastexam-dev-network >/dev/null

          docker run \
            --rm \
            --init \
            --ipc=host \
            --user "$(id -u):$(id -g)" \
            --network pastexam-dev-network \
            -e HOME=/tmp/playwright-home \
            -e CI=true \
            -e PLAYWRIGHT_START_SERVER=false \
            -e PLAYWRIGHT_BASE_URL=http://nginx:8080 \
            -e E2E_FAMILY \
            -e PLAYWRIGHT_BLOB_OUTPUT_FILE \
            -e PLAYWRIGHT_ADMIN_USERNAME \
            -e PLAYWRIGHT_ADMIN_PASSWORD \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work/frontend \
            "$PLAYWRIGHT_IMAGE" \
            bash -lc '
              mkdir -p "$HOME"
              ./node_modules/.bin/playwright test \
                --project="$E2E_FAMILY" \
                --project="${E2E_FAMILY}-admin" \
                --reporter=dot,blob
            '

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-blob-${{ matrix.family }}
          path: frontend/blob-report/report-${{ matrix.family }}.zip
          if-no-files-found: error

      - name: Tear down
        if: always()
        run: >-
          docker compose
          --env-file docker/.env
          -f docker/docker-compose.dev.yml
          down --volumes --remove-orphans

  frontend-e2e:
    name: frontend-e2e
    if: ${{ always() && inputs.run_checks }}
    needs: [frontend-e2e-family]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Playwright report tooling
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Download Chromium blob report
        uses: actions/download-artifact@v8
        with:
          name: frontend-e2e-blob-chromium
          path: frontend/blob-report

      - name: Download Firefox blob report
        uses: actions/download-artifact@v8
        with:
          name: frontend-e2e-blob-firefox
          path: frontend/blob-report

      - name: Download WebKit blob report
        uses: actions/download-artifact@v8
        with:
          name: frontend-e2e-blob-webkit
          path: frontend/blob-report

      - name: Verify complete browser-family artifacts
        working-directory: ./frontend
        run: |
          set -euo pipefail

          expected=(
            blob-report/report-chromium.zip
            blob-report/report-firefox.zip
            blob-report/report-webkit.zip
          )
          for report in "${expected[@]}"; do
            test -f "$report"
          done

          mapfile -t observed < <(
            find blob-report -maxdepth 1 -type f -name '*.zip' -print | sort
          )
          if [[ "${#observed[@]}" -ne "${#expected[@]}" ]]; then
            printf 'Unexpected browser-family blob reports:\n' >&2
            printf '  %s\n' "${observed[@]}" >&2
            exit 1
          fi

      - name: Merge Playwright reports
        working-directory: ./frontend
        run: pnpm exec playwright merge-reports --reporter=html blob-report

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-e2e-report
          path: frontend/playwright-report
          if-no-files-found: error

      - name: Verify browser-family results
        if: always()
        env:
          FAMILY_RESULT: ${{ needs.frontend-e2e-family.result }}
        run: test "$FAMILY_RESULT" = success
