name: ${COMPOSE_PROJECT_NAME:?Set an isolated recovery-review project name}

x-application-environment: &application-environment
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
  FRONTEND_URL: http://localhost:${RECOVERY_REVIEW_HTTP_PORT:-18082}
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:?Set MINIO_BUCKET_NAME}
  EXTERNAL_ENDPOINT: /minio
  REDIS_URL: redis://redis:6379
  DEFAULT_ADMIN_NAME: ${RECOVERY_REVIEW_ADMIN_NAME:?Set RECOVERY_REVIEW_ADMIN_NAME}
  DEFAULT_ADMIN_PASSWORD: ${RECOVERY_REVIEW_ADMIN_PASSWORD:?Set RECOVERY_REVIEW_ADMIN_PASSWORD}
  DEFAULT_ADMIN_EMAIL: ${RECOVERY_REVIEW_ADMIN_EMAIL:?Set RECOVERY_REVIEW_ADMIN_EMAIL}
  RECOVERY_REVIEW_MODE: "true"
  RECOVERY_REVIEW_ADMIN_NAME: ${RECOVERY_REVIEW_ADMIN_NAME:?Set RECOVERY_REVIEW_ADMIN_NAME}

x-runtime-environment: &runtime-environment
  <<: *application-environment
  DB_USER: ${APP_DB_USER:?Set APP_DB_USER}
  DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}

x-migrator-environment: &migrator-environment
  <<: *application-environment
  DB_USER: ${MIGRATOR_DB_USER:?Set MIGRATOR_DB_USER}
  DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD}

services:
  db:
    image: postgres:15.14-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER:?Set MIGRATOR_DB_USER}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      TEST_DB_USER: ${TEST_DB_USER:?Set TEST_DB_USER}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}
      TEST_DATABASE_NAME: ${TEST_DATABASE_NAME:?Set TEST_DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-isolated-roles.sh:/docker-entrypoint-initdb.d/20-isolated-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.5-alpine3.21
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      default:
        aliases:
          - recovery-review-minio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER"
        "$$MINIO_ROOT_PASSWORD" >/dev/null &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET_NAME"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:?Set MINIO_BUCKET_NAME}
    depends_on:
      minio:
        condition: service_healthy

  restore:
    image: postgres:15.14-alpine3.22
    restart: "no"
    profiles: ["prepare"]
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - >-
        pg_restore --list /recovery/source.dump >/dev/null &&
        test "$$(PGPASSWORD="$$POSTGRES_PASSWORD" psql -h db -U "$$POSTGRES_USER"
        -d "$$POSTGRES_DB" -Atc "SELECT to_regclass('public.users') IS NULL")"
        = "t" &&
        PGPASSWORD="$$POSTGRES_PASSWORD" pg_restore --exit-on-error --no-owner
        --no-privileges --role="$$MIGRATOR_DB_USER" -h db -U "$$POSTGRES_USER"
        -d "$$POSTGRES_DB" /recovery/source.dump
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER:?Set MIGRATOR_DB_USER}
    volumes:
      - ${RECOVERY_DUMP_PATH:?Set RECOVERY_DUMP_PATH}:/recovery/source.dump:ro
    depends_on:
      db:
        condition: service_healthy

  migrate:
    image: ${BACKEND_IMAGE:-pastexam-backend-recovery-review:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: "no"
    command: ["python", "migrate.py", "upgrade"]
    environment: *migrator-environment
    depends_on:
      db:
        condition: service_healthy

  review-admin:
    image: ${BACKEND_IMAGE:-pastexam-backend-recovery-review:latest}
    restart: "no"
    profiles: ["prepare"]
    command:
      [
        "python",
        "-m",
        "app.scripts.create_recovery_review_admin",
        "--confirm-database-name",
        "${POSTGRES_DB}",
      ]
    environment: *runtime-environment
    depends_on:
      db:
        condition: service_healthy

  minio-copy:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    profiles: ["prepare"]
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - >-
        mc alias set source http://pastexam-dev-minio:9000
        "$$SOURCE_MINIO_ROOT_USER" "$$SOURCE_MINIO_ROOT_PASSWORD" >/dev/null &&
        mc alias set review http://recovery-review-minio:9000 "$$MINIO_ROOT_USER"
        "$$MINIO_ROOT_PASSWORD" >/dev/null &&
        mc mirror --quiet --preserve
        "source/$$SOURCE_MINIO_BUCKET_NAME"
        "review/$$MINIO_BUCKET_NAME"
    environment:
      SOURCE_MINIO_ROOT_USER: ${SOURCE_MINIO_ROOT_USER:-}
      SOURCE_MINIO_ROOT_PASSWORD: ${SOURCE_MINIO_ROOT_PASSWORD:-}
      SOURCE_MINIO_BUCKET_NAME: ${SOURCE_MINIO_BUCKET_NAME:?Set SOURCE_MINIO_BUCKET_NAME}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:?Set MINIO_BUCKET_NAME}
    networks:
      - default
      - source_minio
    depends_on:
      minio-init:
        condition: service_completed_successfully

  backend:
    image: ${BACKEND_IMAGE:-pastexam-backend-recovery-review:latest}
    restart: unless-stopped
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  frontend:
    image: ${FRONTEND_IMAGE:-pastexam-frontend-recovery-review:latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_SITE_HOSTNAME: http://localhost:${RECOVERY_REVIEW_HTTP_PORT:-18082}
        VITE_UMAMI_SCRIPT_URL: ""
        VITE_UMAMI_WEBSITE_ID: ""
        VITE_RECOVERY_REVIEW_MODE: "true"
    restart: unless-stopped

  nginx:
    image: nginx:1.29.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RECOVERY_REVIEW_HTTP_PORT:-18082}:8080"
    volumes:
      - ../proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:?Set POSTGRES_VOLUME_NAME}
  redis_data:
    name: ${REDIS_VOLUME_NAME:?Set REDIS_VOLUME_NAME}
  minio_data:
    name: ${MINIO_VOLUME_NAME:?Set MINIO_VOLUME_NAME}

networks:
  default:
    name: ${RECOVERY_REVIEW_NETWORK:?Set RECOVERY_REVIEW_NETWORK}
  source_minio:
    name: ${SOURCE_MINIO_NETWORK:?Set SOURCE_MINIO_NETWORK}
    external: true
