name: ${COMPOSE_PROJECT_NAME:-pastexam-dev}

x-application-environment: &application-environment
  APP_ENVIRONMENT: development
  NTHU_DEV_MOCK_ENABLED: ${NTHU_DEV_MOCK_ENABLED:-false}
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
  FRONTEND_URL: http://localhost:${DEV_HTTP_PORT:-8080}
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:?Set MINIO_BUCKET_NAME}
  EXTERNAL_ENDPOINT: http://localhost:${DEV_HTTP_PORT:-8080}/minio
  REDIS_URL: redis://redis:6379
  DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:?Set DEFAULT_ADMIN_NAME}
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?Set DEFAULT_ADMIN_PASSWORD}
  DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:?Set DEFAULT_ADMIN_EMAIL}

x-runtime-environment: &runtime-environment
  <<: *application-environment
  DB_USER: ${APP_DB_USER:?Set APP_DB_USER}
  DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}

x-migrator-environment: &migrator-environment
  <<: *application-environment
  DB_USER: ${MIGRATOR_DB_USER:?Set MIGRATOR_DB_USER}
  DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD}

services:
  db:
    container_name: pastexam-dev-postgres
    image: postgres:15.14-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER:?Set MIGRATOR_DB_USER}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:?Set APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      TEST_DB_USER: ${TEST_DB_USER:?Set TEST_DB_USER}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}
      TEST_DATABASE_NAME: ${TEST_DATABASE_NAME:?Set TEST_DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-isolated-roles.sh:/docker-entrypoint-initdb.d/20-isolated-roles.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    container_name: pastexam-dev-redis
    image: redis:7.4.5-alpine3.21
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    container_name: pastexam-dev-minio
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER"
        "$$MINIO_ROOT_PASSWORD" >/dev/null &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET_NAME"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:?Set MINIO_BUCKET_NAME}
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    image: ${BACKEND_IMAGE:-pastexam-backend-dev:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    restart: "no"
    command: ["python", "migrate.py", "upgrade"]
    environment: *migrator-environment
    depends_on:
      db:
        condition: service_healthy

  bootstrap:
    image: ${BACKEND_IMAGE:-pastexam-backend-dev:latest}
    restart: "no"
    command:
      [
        "python",
        "-m",
        "app.scripts.seed_db",
        "--confirm-database-name",
        "${POSTGRES_DB}",
      ]
    environment:
      <<: *runtime-environment
      ALLOW_DATABASE_BOOTSTRAP: "true"
      BOOTSTRAP_LOCAL_PROJECT: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["bootstrap"]

  backend:
    container_name: pastexam-dev-backend
    image: ${BACKEND_IMAGE:-pastexam-backend-dev:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ${DEVELOPMENT_BACKEND_ENV_FILE:-../backend/.env}
    environment: *runtime-environment
    volumes:
      - /app/.venv
      - ../backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  frontend:
    container_name: pastexam-dev-frontend
    image: ${FRONTEND_IMAGE:-pastexam-frontend-dev:latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - ${DEVELOPMENT_FRONTEND_ENV_FILE:-../frontend/.env}
    environment:
      VITE_API_BASE_URL: /api
      VITE_SITE_HOSTNAME: http://localhost:${DEV_HTTP_PORT:-8080}
      VITE_NTHU_DEV_MOCK_ENABLED: ${NTHU_DEV_MOCK_ENABLED:-false}
    command: >-
      sh -c "CI=true pnpm install --frozen-lockfile
      --store-dir /app/node_modules/.pnpm-store
      && exec pnpm run dev --host 0.0.0.0 --port 80"
    ports:
      - "127.0.0.1:${DEV_HMR_PORT:-24678}:24678"
    volumes:
      - /app/node_modules
      - ../frontend:/app
    working_dir: /app

  nginx:
    container_name: pastexam-dev-nginx
    image: nginx:1.29.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-8080}:8080"
    volumes:
      - ../proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../proxy/nginx.development-listeners.conf:/etc/nginx/pastexam-listeners.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-pastexam-postgres-data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-pastexam-redis-data}
  minio_data:
    name: ${MINIO_VOLUME_NAME:-pastexam-minio-data}

networks:
  default:
    name: ${TARGET_NETWORK_NAME:-pastexam-dev-network}
