name: pastexam

services:
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/nthu-physics-sa-it/pastexam:frontend}
    container_name: pastexam-frontend
    restart: always
    # ports:
    #   - "5173:80"
    networks:
      app_network:
        aliases:
          - frontend

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/nthu-physics-sa-it/pastexam:backend}
    container_name: pastexam-backend
    restart: always
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started
    # ports:
    #   - "8000:8000"
    env_file:
      - ${PRODUCTION_BACKEND_ENV_FILE:-/opt/pastexam-config/backend.env}
    environment:
      # Uvicorn accepts forwarded identity only from this exact nginx peer.
      FORWARDED_ALLOW_IPS: ${PRODUCTION_NGINX_PROXY_IP:?Set PRODUCTION_NGINX_PROXY_IP}
    networks:
      app_network:
        aliases:
          - backend
      trusted_proxy_network:
        aliases:
          - backend-trusted

  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/nthu-physics-sa-it/pastexam:backend}
    restart: "no"
    command: ["python", "migrate.py", "upgrade"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ${PRODUCTION_MIGRATOR_ENV_FILE:-/opt/pastexam-config/migrator.env}
    networks:
      - app_network

  db:
    image: postgres:15.14-alpine3.22
    container_name: pastexam-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # ports:
    #   - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: pastexam-minio
    restart: always
    command: server /data --console-address ":9001"
    # ports:
    #   - "9000:9000"
    #   - "9001:9001" # 9000 for S3 API, 9001 for MinIO Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      app_network:
        aliases:
          - minio

  redis:
    image: redis:7.4.5-alpine3.21
    container_name: pastexam-redis
    restart: always
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  nginx:
    image: nginx:1.29.2
    container_name: pastexam-nginx
    restart: always
    expose:
      - "8080"
      - "8443"
    volumes:
      - ../proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../proxy/nginx.production-listeners.conf:/etc/nginx/pastexam-listeners.conf:ro
    depends_on:
      - frontend
      - backend
      - minio
    networks:
      app_network:
      trusted_proxy_network:
        # The dynamic pool excludes this exact immediate proxy trusted by Uvicorn.
        ipv4_address: ${PRODUCTION_NGINX_PROXY_IP:?Set PRODUCTION_NGINX_PROXY_IP}

networks:
  app_network:
    name: pastexam-network
    driver: bridge
  trusted_proxy_network:
    name: pastexam-trusted-proxy-network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.30.0.0/28
          ip_range: 172.30.0.8/29
          gateway: 172.30.0.1

volumes:
  pg_data:
    name: pastexam-postgres-data
  minio_data:
    name: pastexam-minio-data
  redis_data:
    name: pastexam-redis-data
