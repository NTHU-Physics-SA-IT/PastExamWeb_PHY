name: ${COMPOSE_PROJECT_NAME:?Set an isolated clean-development project name}

x-application-environment: &application-environment
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB}
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
  FRONTEND_URL: http://127.0.0.1:${CLEAN_DEV_HTTP_PORT:-18081}
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:?Set MINIO_BUCKET_NAME}
  EXTERNAL_ENDPOINT: http://127.0.0.1:${CLEAN_DEV_HTTP_PORT:-18081}/minio
  REDIS_URL: redis://redis:6379
  DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:?Set DEFAULT_ADMIN_NAME}
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:?Set DEFAULT_ADMIN_PASSWORD}
  DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:?Set DEFAULT_ADMIN_EMAIL}

x-runtime-environment: &runtime-environment
  <<: *application-environment
  DB_USER: ${APP_DB_USER:?Set APP_DB_USER}
  DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}

x-migrator-environment: &migrator-environment
  <<: *application-environment
  DB_USER: ${MIGRATOR_DB_USER:?Set MIGRATOR_DB_USER}
  DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD}

services:
  db:
    image: postgres:15.14-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      TEST_DB_USER: ${TEST_DB_USER}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD}
      TEST_DATABASE_NAME: ${TEST_DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-isolated-roles.sh:/docker-entrypoint-initdb.d/20-isolated-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.5-alpine3.21
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: "no"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER"
        "$$MINIO_ROOT_PASSWORD" >/dev/null &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET_NAME"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    depends_on:
      minio:
        condition: service_healthy

  migrate:
    image: ${BACKEND_IMAGE:-pastexam-backend-clean-dev:latest}
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: "no"
    command: ["python", "migrate.py", "upgrade"]
    environment: *migrator-environment
    depends_on:
      db:
        condition: service_healthy

  bootstrap:
    image: ${BACKEND_IMAGE:-pastexam-backend-clean-dev:latest}
    restart: "no"
    command:
      [
        "python",
        "-m",
        "app.scripts.seed_db",
        "--confirm-database-name",
        "${POSTGRES_DB}",
      ]
    environment:
      <<: *runtime-environment
      ALLOW_DATABASE_BOOTSTRAP: "true"
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["bootstrap"]

  backend:
    image: ${BACKEND_IMAGE:-pastexam-backend-clean-dev:latest}
    restart: unless-stopped
    environment: *runtime-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  frontend:
    image: ${FRONTEND_IMAGE:-pastexam-frontend-clean-dev:latest}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_SITE_HOSTNAME: http://127.0.0.1:${CLEAN_DEV_HTTP_PORT:-18081}
        VITE_UMAMI_SCRIPT_URL: ""
        VITE_UMAMI_WEBSITE_ID: ""
    restart: unless-stopped

  nginx:
    image: nginx:1.29.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CLEAN_DEV_HTTP_PORT:-18081}:8080"
    volumes:
      - ../proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  minio_data:
